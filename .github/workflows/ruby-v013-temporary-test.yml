name: RUBY V0.1.3 temporary regression
on:
  push:
    branches:
      - fix/smart-chip-v0.1.3-batch-progress
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Embedded Python engine and 26-strategy regression
        shell: bash
        run: |
          python - <<'RUBY_REGRESSION_PY'
          from pathlib import Path
          import re, sys, json, copy, traceback, py_compile, itertools
          html=Path('index.html').read_text(encoding='utf-8')
          modules=re.findall(r'<script type="text/plain" id="py-src-([^"]+)">([\s\S]*?)</script>',html)
          assert len(modules)==8, f"Expected 8 Python modules, found {len(modules)}"
          for name,code in modules:
              Path(name).write_text(code,encoding='utf-8')
              py_compile.compile(name,doraise=True)
          sys.path.insert(0,str(Path.cwd()))
          import web_engine, sizing_v180, strategy_engine
          codes=[0,99,66]+list(range(1,15))+list(range(16,21))+[22,23,24,26]
          assert len(codes)==26
          assert sorted(strategy_engine.BY_CODE)==sorted(codes)
          cases=0
          action_seq=itertools.count(1)
          def ok(condition,message):
              global cases
              cases+=1
              if not condition: raise AssertionError(message)
          def call(op,params=None):
              result=json.loads(web_engine.web_call(op,json.dumps(params or {},ensure_ascii=False)))
              if not result['ok']: raise AssertionError(f"{op}: {result['error']}")
              return result['result']
          def start(code,planned=35,operation=500000,profit=10000,loss=100):
              config=dict(strategy=code,operation=operation,parts=6,count=6,maxSteps=5,
                          planned=planned,profitPct=profit,lossPct=loss,market='單球')
              config.update({0:{'loss_sequence':[1,2,3,4,5]},99:{'custom_win_sequence':[1,2,3,4,5]},
                             66:{'layer_sequence':[1,2,3,4,5]},14:{'win_sequence':[1,2,3,4,5]},
                             20:{'attack_sequence':[1,2,3,4,5,6], 'retreat_sequence':[1,2,3,4,5,6]},
                             24:{'cancel_list':[1,1,1,1]}}.get(code,{}))
              if code==23:config['probability']=90
              return call('start',config)
          def settle(result):
              if web_engine.STATE and web_engine.STATE['strategy']=='凱利公式':
                  call('probability',{'value':90})
              return call('settle',{'outcome':result,'actionId':'regression-'+str(next(action_seq))})
          summary=[]
          for code in codes:
              try:
                  v=start(code)
                  ok(v['state']['wins']==0 and v['state']['losses']==0, f"#{code} invalid start")
                  q=v['quote']
                  ok(q is not None, f"#{code} no initial quote: {v.get('status')}")
                  initial=copy.deepcopy(v['state'])
                  win=settle('win')
                  ok(win['state']['wins']+win['state']['losses']==1,f"#{code} missing settlement")
                  ok(len(win['state']['ledger'])==1,f"#{code} ledger mismatch")
                  undone=call('undo')
                  ok(undone['state']['wins']==0 and undone['state']['losses']==0,f"#{code} undo failed")
                  ok(undone['state']['pnl']==initial['pnl'],f"#{code} undo PnL changed")
                  win=settle('win')
                  ok(win['state']['wins']==1,f"#{code} win replay mismatch")
                  snapshot=copy.deepcopy(win['state'])
                  restored=call('load',{'state':snapshot,'undo':None})
                  ok(restored['state']['wins']==1 and restored['state']['pnl']==win['state']['pnl'],f"#{code} restore mismatch")
                  if restored['state']['strategy']=='凱利公式':
                      restored=call('probability',{'value':90})
                  if restored['quote']:
                      v=settle('loss')
                      ok(v['state']['losses']==1,f"#{code} loss not booked")
                      summary.append((code,'win/undo/restore/loss PASS'))
                  else:
                      summary.append((code,'win/undo/restore PASS; loss blocked: '+restored['status'][:60]))
              except Exception:
                  print(f"FAIL strategy #{code}")
                  traceback.print_exc()
                  raise
          print("STRATEGY SUMMARY")
          for a,b in summary:print(f"#{a}: {b}")
          for code in (9,18):
              v=start(code,planned=35,operation=5000000)
              initial_quote=v['quote']
              ok(initial_quote is not None,f"#{code} missing first quote")
              for n in range(1,72):
                  if not v['quote']:raise AssertionError(f"#{code} stopped before result {n}: {v['status']}")
                  v=settle('win')
                  s=v['state']
                  ok(len(s['ledger'])==n and s['wins']+s['losses']==n,f"#{code} ledger at {n}")
                  if n in (35,70):
                      ok(s['session_status']=='active',f"#{code} paused at {n}")
                      ok(v['quote'] is not None,f"#{code} no next quote at {n}: {v['status']}")
                      ok(s['web_batch_total_cap']==n+35,f"#{code} did not extend batch cap at {n}")
                      ok(s['web_batch_start_pnl']==s['pnl'],f"#{code} failed to record batch origin")
                  if code==9 and n in (35,36,70,71):
                      ok(v['quote'] is not None and v['quote']['per']>=1,f"#09 has zero base after batch at {n}: {v['status']}")
              print(f"BATCH #{code}: 71 consecutive settlements PASS")
          # Undo across the 35th boundary
          v=start(18,planned=35,operation=5000000)
          for n in range(35):v=settle('win')
          ok(v['state']['web_batch_total_cap']==70,"35th result should advance cap")
          v=call('undo')
          ok(v['state']['wins']==34 and v['state']['web_batch_total_cap']==35,"boundary undo should restore 34/35")
          v=settle('win')
          ok(v['state']['wins']==35 and v['state']['web_batch_total_cap']==70,"boundary replay should advance")
          print("BATCH UNDO PASS")
          # Recover old paused 35/35 state
          legacy=copy.deepcopy(v['state'])
          legacy['session_status']='paused_round_limit'
          legacy['strategy_pause_reason']='已達計畫局數'
          legacy['web_batch_total_cap']=35
          legacy['round_limit']=35
          legacy.pop('web_batch_start_pnl',None)
          v=call('load',{'state':legacy})
          ok(v['state']['session_status']=='active' and v['state']['web_batch_total_cap']==70,"legacy recover not active")
          ok(v['quote'] is not None,"legacy recover missing quote")
          print("LEGACY 35/35 RECOVERY PASS")
          # Cooldown recovery
          v=start(7,planned=35,operation=5000000)
          for n in range(3):
              ok(v['quote'] is not None,"cooldown quote missing")
              v=settle('loss')
          ok(v['state']['session_status']=='paused_cooldown',"three losses did not pause #07")
          ok(v['canResume'],"cooldown restore button unavailable")
          v=call('resume')
          ok(v['state']['session_status']=='active' and v['state']['cooldown_losses']==0,"cooldown not resumed")
          ok(v['state']['losses']==3 and v['quote'] is not None,"cooldown lost history or quote")
          print("COOLDOWN RESUME PASS")
          print(f"ALL CHECKS PASSED: {cases}")
          RUBY_REGRESSION_PY

      - name: Browser Playwright prerequisites
        shell: bash
        run: |
          python -m pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Mobile browser Pyodide roundtrip
        shell: bash
        run: |
          python - <<'RUBY_BROWSER_PY'
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from threading import Thread
          from playwright.sync_api import sync_playwright
          server=ThreadingHTTPServer(('127.0.0.1',0),SimpleHTTPRequestHandler)
          Thread(target=server.serve_forever,daemon=True).start()
          url=f'http://127.0.0.1:{server.server_address[1]}/index.html'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              context=browser.new_context(viewport={'width':390,'height':844},device_scale_factor=1)
              page=context.new_page()
              page.goto(url,wait_until='domcontentloaded')
              page.wait_for_function("document.querySelector('#engine-status')?.textContent?.includes('計算核心已就緒')",timeout=120000)
              page.locator('#create-plan').click()
              page.locator('#strategy-select').select_option('18')
              page.locator('[name=operation]').fill('5000000')
              page.locator('[name=planned]').fill('35')
              page.locator('details.advanced').evaluate('(el)=>{el.open=true;}')
              page.locator('[name=profitPct]').fill('10000')
              page.locator('#start-button').click()
              page.wait_for_function("!document.querySelector('#win-button').disabled")
              for i in range(35):
                  page.locator('#win-button').click()
              assert '#2' in page.locator('#round-count').inner_text(),page.locator('#round-count').inner_text()
              assert '0 / 35' in page.locator('#round-count').inner_text()
              assert not page.locator('#win-button').is_disabled()
              assert not page.locator('#loss-button').is_disabled()
              print('BROWSER 35/35 -> #2 and buttons PASS')
              page.locator('#win-button').click()
              assert '#2' in page.locator('#round-count').inner_text()
              assert '1 / 35' in page.locator('#round-count').inner_text()
              page.locator('#undo-button').click()
              assert '0 / 35' in page.locator('#round-count').inner_text()
              print('BROWSER #2 and undo PASS')
              page.reload(wait_until='domcontentloaded')
              page.wait_for_function("document.querySelector('#engine-status')?.textContent?.includes('計算核心已就緒')",timeout=120000)
              assert '#2' in page.locator('#round-count').inner_text()
              assert not page.locator('#win-button').is_disabled()
              print('BROWSER localStorage restoration PASS')
              # Start a new cooldown plan, requiring a confirmation for previous ledger.
              page.locator('#create-plan').click()
              page.on('dialog',lambda dialog:dialog.accept())
              page.locator('#strategy-select').select_option('7')
              page.locator('[name=operation]').fill('5000000')
              page.locator('#start-button').click()
              page.wait_for_function("!document.querySelector('#loss-button').disabled")
              for i in range(3):
                  page.locator('#loss-button').click()
              assert page.locator('#win-button').is_disabled(), 'cooldown should disable settle'
              assert page.locator('#resume-button').is_visible(), 'cooldown resume should show'
              page.locator('#resume-button').click()
              assert not page.locator('#loss-button').is_disabled(), 'cooldown resumed'
              print('BROWSER cooldown pause/resume PASS')
              context.close()
              browser.close()
          server.shutdown()
          print('ALL BROWSER CHECKS PASSED')
          RUBY_BROWSER_PY
